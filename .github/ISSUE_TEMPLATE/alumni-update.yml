  - type: input
    id: name
    attributes:
      label: Full name
      description: Only if you are not listed, or to change the name shown. Leave empty otherwise.
  - type: dropdown
    id: level
    attributes:
      label: Level in the lab
      description: Your highest level in the lab. Required when leaving or not listed; leave empty to keep it.
      options: [Postdoctoral fellow, PhD, MSc, Undergraduate, Visiting researcher]
  - type: input
    id: years
    attributes:
      label: Years in the lab
      description: e.g. 2020–2025. Required when leaving or not listed.
  - type: input
    id: position
    attributes:
      label: Current position
      description: 'e.g. "Postdoctoral fellow, National Research Council Canada". Required when leaving or not listed.'
  - type: input
    id: link
    attributes:
      label: Link
      description: Your group, faculty or company page; makes your position clickable
      placeholder: https://
  - type: dropdown
    id: for
    attributes:
      label: Submitting for
      description: Someone else is flagged for a closer check
      options: [Myself, Someone else]
    validations:
      required: true
