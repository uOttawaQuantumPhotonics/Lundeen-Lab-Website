- name: Manuel Ferrer-García
  role: Postdoctoral fellow
  project: ""
  bio: Manuel Ferrer-García is a postdoctoral fellow at the University of Ottawa, where he develops compact optical devices for quantum information processing. His research focuses on structured light, multilayer photonics, and the manipulation of spatial and polarization degrees of freedom of light. Passionate about scientific collaboration, mentorship, and outreach, he actively supports the optics community. Outside the lab, he enjoys cycling, volunteering at community bike workshops, and discovering good coffee spots.
