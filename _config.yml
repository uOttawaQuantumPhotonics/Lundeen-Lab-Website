# =============================================================================
# _config.yml: site-wide settings for the Lundeen Lab website (Jekyll)
# -----------------------------------------------------------------------------
# Jekyll reads this file once at the start of every build. Changes here need a
# rebuild (GitHub does this automatically when you push to main).
# See docs/how-it-works.md for an overview of the whole site.
# =============================================================================

title: "Lundeen Lab for Quantum Photonics"
description: >-
  We explore the fundamental principles of quantum physics and harness the
  unique properties of light to develop novel technologies.

# Where the site is served from: the custom domain photonicquantum.info (since 10 Nov 2026).
#   The site sits at the top level of the domain, so baseurl is "".
#   The deploy workflow passes GitHub's own base path to Jekyll as well, so a build after
#   any change of address in Settings → Pages picks it up. If the custom domain is ever
#   removed, the site moves back to https://uottawaquantumphotonics.github.io/Lundeen-Lab-Website/:
#   set url to "https://uottawaquantumphotonics.github.io" and baseurl to "/Lundeen-Lab-Website",
#   then rebuild. See docs/admin-guide.md.
url: "https://photonicquantum.info"
baseurl: ""

# The GitHub repository; used to build links to the update forms.
repository: "uOttawaQuantumPhotonics/Lundeen-Lab-Website"

# Contact address shown on the site and used by the "Email Jeff" buttons.
contact_email: "jlundeen@uottawa.ca"

# Every page lives at a clean address such as /research/ rather than /research.html.
permalink: pretty

# Files and folders that are part of the repository but are not web pages.
exclude:
  - README.md
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .github/
  - _bibliography/
